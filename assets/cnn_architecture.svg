<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">CIFAR-10 convolutional neural network architecture</title>
  <desc id="desc">A 32 by 32 RGB image passes through three convolution, ReLU, and max-pooling blocks, then a 2048 to 256 dense layer with dropout and a 10-class output.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfe}.title{font:700 34px Inter,Arial,sans-serif;fill:#172033}.sub{font:16px Inter,Arial,sans-serif;fill:#667085}.label{font:600 17px Inter,Arial,sans-serif;fill:#202a3a}.small{font:14px Inter,Arial,sans-serif;fill:#667085}.chip{fill:#eef2ff;stroke:#d7ddfb;stroke-width:1.5}.box{fill:#fff;stroke:#cfd5df;stroke-width:2}.accent{fill:#4f46e5}.arrow{stroke:#7c8594;stroke-width:2.5;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c8594"/></marker>
  </defs>
  <rect class="bg" width="1600" height="620" rx="20"/>
  <text class="title" x="64" y="72">CIFAR-10 image classifier</text>
  <text class="sub" x="64" y="103">Custom CNN · 32 × 32 RGB input · 10 output classes</text>

  <rect class="box" x="64" y="214" width="156" height="150" rx="14"/>
  <g transform="translate(99 244)"><rect width="78" height="78" rx="6" fill="#dbeafe"/><path d="M5 58L30 34L47 49L60 27L74 43V74H5Z" fill="#7c9b77"/><circle cx="57" cy="19" r="8" fill="#f2c66d"/><path d="M5 60L30 36L46 50" fill="none" stroke="#fff" stroke-width="3"/></g>
  <text class="label" x="142" y="342" text-anchor="middle">Input image</text>
  <text class="small" x="142" y="386" text-anchor="middle">3 × 32 × 32</text>

  <path class="arrow" d="M224 289H268"/>
  <g>
    <rect class="box" x="282" y="196" width="270" height="186" rx="14"/>
    <rect class="accent" x="282" y="196" width="8" height="186" rx="4"/>
    <text class="label" x="417" y="232" text-anchor="middle">Feature block 1</text>
    <rect class="chip" x="312" y="252" width="210" height="34" rx="17"/><text class="small" x="417" y="274" text-anchor="middle">Conv2d · 32 filters</text>
    <rect class="chip" x="312" y="298" width="210" height="34" rx="17"/><text class="small" x="417" y="320" text-anchor="middle">ReLU · MaxPool2d</text>
    <text class="small" x="417" y="361" text-anchor="middle">32 × 16 × 16</text>
  </g>
  <path class="arrow" d="M552 289H588"/>
  <g>
    <rect class="box" x="602" y="196" width="270" height="186" rx="14"/>
    <rect class="accent" x="602" y="196" width="8" height="186" rx="4"/>
    <text class="label" x="737" y="232" text-anchor="middle">Feature block 2</text>
    <rect class="chip" x="632" y="252" width="210" height="34" rx="17"/><text class="small" x="737" y="274" text-anchor="middle">Conv2d · 64 filters</text>
    <rect class="chip" x="632" y="298" width="210" height="34" rx="17"/><text class="small" x="737" y="320" text-anchor="middle">ReLU · MaxPool2d</text>
    <text class="small" x="737" y="361" text-anchor="middle">64 × 8 × 8</text>
  </g>
  <path class="arrow" d="M872 289H908"/>
  <g>
    <rect class="box" x="922" y="196" width="270" height="186" rx="14"/>
    <rect class="accent" x="922" y="196" width="8" height="186" rx="4"/>
    <text class="label" x="1057" y="232" text-anchor="middle">Feature block 3</text>
    <rect class="chip" x="952" y="252" width="210" height="34" rx="17"/><text class="small" x="1057" y="274" text-anchor="middle">Conv2d · 128 filters</text>
    <rect class="chip" x="952" y="298" width="210" height="34" rx="17"/><text class="small" x="1057" y="320" text-anchor="middle">ReLU · MaxPool2d</text>
    <text class="small" x="1057" y="361" text-anchor="middle">128 × 4 × 4</text>
  </g>
  <path class="arrow" d="M1192 289H1228"/>
  <g>
    <rect class="box" x="1242" y="196" width="294" height="186" rx="14"/>
    <rect class="accent" x="1242" y="196" width="8" height="186" rx="4"/>
    <text class="label" x="1389" y="232" text-anchor="middle">Classifier</text>
    <rect class="chip" x="1272" y="252" width="234" height="34" rx="17"/><text class="small" x="1389" y="274" text-anchor="middle">Flatten · Linear 2048 → 256</text>
    <rect class="chip" x="1272" y="298" width="234" height="34" rx="17"/><text class="small" x="1389" y="320" text-anchor="middle">ReLU · Dropout 0.4</text>
    <text class="small" x="1389" y="361" text-anchor="middle">Linear → 10 scores</text>
  </g>

  <path d="M64 454H1536" stroke="#e5e7eb" stroke-width="2"/>
  <text class="label" x="64" y="503">Training setup</text>
  <text class="small" x="64" y="540">Cross-entropy loss</text>
  <text class="small" x="350" y="540">Adam · learning rate 0.001</text>
  <text class="small" x="750" y="540">Batch size 128</text>
  <text class="small" x="1020" y="540">10 epochs</text>
  <text class="small" x="1240" y="540">10 CIFAR-10 classes</text>
</svg>
